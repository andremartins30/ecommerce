# Local development dependencies only. Not a deployment artefact.
#
#   docker compose up -d
#   docker compose down          # keeps data
#   docker compose down -v       # drops the volumes
#
# Credentials here are intentionally weak and bound to localhost. Nothing in
# this file should be reused for a hosted environment.

services:
  postgres:
    image: postgres:16.11-alpine
    container_name: perfumaria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: perfumaria
      POSTGRES_PASSWORD: perfumaria
      POSTGRES_DB: perfumaria
      # Deterministic collation so ordering in tests matches production.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Host port 55432 on purpose: a locally installed PostgreSQL commonly
      # already owns 5432, and this container should not have to compete with
      # it. Keep DATABASE_URL in .env.local in sync.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumaria -d perfumaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.7-alpine
    container_name: perfumaria-redis
    restart: unless-stopped
    # Persistence on: rate-limit counters and reservation locks should survive a
    # container restart during development.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 16379 for the same reason as PostgreSQL above.
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
